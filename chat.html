<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat · Nexora</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="page">

        <section class="card chat">

            <h2>
                Rahul
            </h2>


            <div id="chatMessages"></div>


            <div class="row">

                <input
                    id="chatInput"
                    placeholder="Type a message"
                >

                <button
                    id="sendBtn"
                    class="btn"
                >
                    Send
                </button>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/chat.js"
    ></script>

</body>

</html>
